name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # --- PASSO ÚNICO: Gera a keystore automaticamente no servidor do GitHub ---
      - name: Generate and Encode Keystore for First Time
        run: |
          # Gera a keystore com uma senha padrão de exemplo
          keytool -genkey -v -keystore upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass minha_senha123 -keypass minha_senha123 -dname "CN=Meu Nome, OU=Minha Org, O=Minha Empresa, L=Cidade, ST=Estado, C=BR"
          
          echo "--- COPIE O TEXTO ABAIXO PARA O SEU KEYSTORE_BASE64 ---"
          base64 -w 0 upload-keystore.jks
          echo ""
          echo "--------------------------------------------------------"
      # --------------------------------------------------------------------------

      - run: flutter pub get
      - run: flutter build apk --release